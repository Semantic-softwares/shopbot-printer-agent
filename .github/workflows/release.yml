name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - both
          - macos
          - windows

permissions:
  contents: write # Required for creating releases and uploading assets

# The platform jobs only BUILD. electron-builder cannot add files to a release that is already published, so letting each
# platform publish on its own made the slower one fail ("already_exists") and its installer never uploaded. One final job
# creates the release once and uploads what every platform built.
jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Don't cancel other builds if one fails
      matrix:
        os: [macos-latest, windows-2022] # windows-2022 pinned: windows-latest's newer MSVC toolset can't compile @abandonware/noble's WinRT binding

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platforms == 'both' ||
          (github.event.inputs.platforms == 'macos' && matrix.os == 'macos-latest') ||
          (github.event.inputs.platforms == 'windows' && matrix.os == 'windows-2022')
        run: npm ci

      # macOS: Build only
      - name: Build (macOS)
        if: |
          matrix.os == 'macos-latest' &&
          (github.event_name == 'push' || github.event.inputs.platforms == 'both' || github.event.inputs.platforms == 'macos')
        env:
          # Skip code signing if no certificate is configured
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --mac --publish never

      # Windows: Build only
      - name: Build (Windows)
        if: |
          matrix.os == 'windows-2022' &&
          (github.event_name == 'push' || github.event.inputs.platforms == 'both' || github.event.inputs.platforms == 'windows')
        run: npm run build && npx electron-builder --win --publish never

      - name: Collect installers and update files
        id: collect
        shell: bash
        run: |
          if ls release/latest*.yml >/dev/null 2>&1; then
            mkdir -p upload
            cp release/latest*.yml upload/
            # The update files name the installers with dashes where the build output has spaces; the uploaded names must match.
            for f in release/*.exe release/*.dmg release/*.zip release/*.blockmap; do
              [ -f "$f" ] && cp "$f" "upload/$(basename "$f" | tr ' ' '-')"
            done
            ls -la upload
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing was built on this platform."
          fi

      - name: Keep the build output
        if: steps.collect.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: upload/*
          if-no-files-found: error

  publish:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download every platform's build
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the release once and upload everything
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          ls -la assets
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "$VERSION" --notes "ShopBot Printer $VERSION"
          # --clobber: a rebuild of one platform replaces its files and leaves the other platform's alone.
          gh release upload "$VERSION" assets/* --clobber
          gh release view "$VERSION" --json assets --jq '.assets[].name'
