name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - both
          - macos
          - windows

permissions:
  contents: write # Required for creating releases and uploading assets

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Don't cancel other builds if one fails
      matrix:
        os: [macos-latest, windows-2022] # windows-2022 pinned: windows-latest's newer MSVC toolset can't compile @abandonware/noble's WinRT binding

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: |
          github.event_name == 'push' ||
          github.event.inputs.platforms == 'both' ||
          (github.event.inputs.platforms == 'macos' && matrix.os == 'macos-latest') ||
          (github.event.inputs.platforms == 'windows' && matrix.os == 'windows-2022')
        run: npm ci

      # macOS: Build and publish
      - name: Build & Release (macOS)
        if: |
          matrix.os == 'macos-latest' &&
          (github.event_name == 'push' || github.event.inputs.platforms == 'both' || github.event.inputs.platforms == 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing if no certificate is configured
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release:mac

      # Windows: Build and publish
      - name: Build & Release (Windows)
        if: |
          matrix.os == 'windows-2022' &&
          (github.event_name == 'push' || github.event.inputs.platforms == 'both' || github.event.inputs.platforms == 'windows')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win
