<div class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200">
  <a [routerLink]="['/dashboard/printers', printer().id]" class="block">
    <!-- Card Header -->
    <div class="flex items-start gap-3 p-5 border-b border-gray-100 dark:border-slate-700">
      <span class="text-3xl leading-none">{{ icon() }}</span>
      <div class="flex-1 min-w-0">
        <h3 class="text-base font-semibold text-gray-900 dark:text-white truncate">{{ printer().name }}</h3>
        <span class="inline-block mt-1 text-xs font-medium uppercase tracking-wider text-gray-400 dark:text-slate-500">{{ typeName() }}</span>
      </div>
    </div>

    <!-- Card Body -->
    <div class="px-5 py-4 space-y-1.5 text-sm">
      <p class="text-gray-600 dark:text-slate-300"><span class="font-medium text-gray-500 dark:text-slate-400">Address:</span> {{ details() }}</p>
      @if (printer().createdAt) {
        <p class="text-gray-600 dark:text-slate-300"><span class="font-medium text-gray-500 dark:text-slate-400">Added:</span> {{ addedAt() }}</p>
      }
    </div>
  </a>

  <!-- Card Actions -->
  <div class="flex justify-end gap-2 px-5 py-3 border-t border-gray-100 dark:border-slate-700">
    <a [routerLink]="['/dashboard/printers', printer().id]"
       class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
      👁️ Details
    </a>
    <button (click)="test.emit(printer())"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 rounded-lg transition-colors">
      ✅ Test
    </button>
    <button (click)="remove.emit(printer().id)"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors">
      🗑️ Remove
    </button>
  </div>
</div>
